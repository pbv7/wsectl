name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Single fan-in check that passes only when every test matrix leg passes.
  # Used as the required status check in the main-branch ruleset so the
  # ruleset does not need to enumerate matrix variants.
  tests:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test matrix leg failed or was cancelled
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - run: make lint-md
      - run: make lint-workflows
      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends shellcheck
      - run: make lint-shell
      - run: npm audit --audit-level=high
      - run: make coverage-check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.out
          flags: unittests
          name: wsectl-go
          fail_ci_if_error: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          go-package: ./...
          repo-checkout: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.16.0
          args: check

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
