version: 2

project_name: wsectl

builds:
  - main: ./cmd/wsectl
    binary: wsectl
    env:
      - CGO_ENABLED=0
    # darwin needs cgo to compile the macOS Keychain backend in
    # github.com/99designs/keyring (//go:build darwin && cgo). linux/windows
    # native keyring backends are pure-Go. See docs/adr/0001-cgo-and-keyring-backends.md.
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch arm64
          - CXX=clang++ -arch arm64
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch x86_64
          - CXX=clang++ -arch x86_64
    ldflags:
      - -s -w -X github.com/pbv7/wsectl/internal/app.Version={{.Version}} -X github.com/pbv7/wsectl/internal/app.Commit={{.Commit}} -X github.com/pbv7/wsectl/internal/app.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: wsectl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: docs/*.md
        dst: docs
      - src: docs/adr/*.md
        dst: docs/adr
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      # Match both unscoped (docs:) and scoped (docs(x):) conventional types,
      # so housekeeping commits stay out of the changelog either way.
      - '^docs(\([^)]+\))?:'
      - '^test(\([^)]+\))?:'
      - '^chore(\([^)]+\))?:'
      - '^ci(\([^)]+\))?:'
      - '^style(\([^)]+\))?:'
      - 'typo'
  groups:
    # goreleaser matches group regexps against the SHA-prefixed line
    # ("<sha>[:] <subject>"), so each regexp skips the SHA with an explicit
    # delimiter and then anchors the type right after it — not a lazy ".*?",
    # which would let a type match as a substring (e.g. the "fix" in "prefix").
    # The Breaking group matches first, on a fixed list of conventional types
    # carrying a "!". The closed list is intentional rather than an open \w+
    # token: it already covers every type this repo uses, and an open token
    # would reclassify non-standard single-word subjects (e.g. "hotfix!:") as
    # breaking. If a new type is ever adopted (e.g. "security"), add it here.
    # goreleaser assigns each commit to the first matching group; the named
    # groups below stay literal (feat/fix/...).
    - title: '⚠️ Breaking Changes'
      regexp: '^[0-9a-f]+:?\s+(feat|fix|perf|refactor|build|chore|ci|docs|test|style|revert)(\([^)]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^[0-9a-f]+:?\s+feat(\([^)]+\))?!?:.+$'
      order: 1
    - title: 'Bug Fixes'
      regexp: '^[0-9a-f]+:?\s+fix(\([^)]+\))?!?:.+$'
      order: 2
    - title: Performance
      regexp: '^[0-9a-f]+:?\s+perf(\([^)]+\))?!?:.+$'
      order: 3
    - title: Refactoring
      regexp: '^[0-9a-f]+:?\s+refactor(\([^)]+\))?!?:.+$'
      order: 4
    - title: Dependencies
      regexp: '^[0-9a-f]+:?\s+build\(deps[^)]*\)!?:.+$'
      order: 5
    - title: Others
      order: 999

release:
  github:
    owner: pbv7
    name: wsectl
  name_template: "{{.ProjectName}} v{{.Version}}"
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew install pbv7/tap/wsectl
    ```

    ### Go Install
    ```bash
    go install github.com/pbv7/wsectl/cmd/wsectl@latest
    ```

    ### Binary Download
    Download the appropriate archive from the assets below, extract,
    and place `wsectl` (or `wsectl.exe`) on your `PATH`. Verify against
    `checksums.txt` if needed.
    {{- if .PreviousTag }}

    ---
    **Full Changelog**: https://github.com/pbv7/wsectl/compare/{{ .PreviousTag }}...{{ .Tag }}
    {{- end }}

homebrew_casks:
  - name: wsectl
    ids: [wsectl]
    repository:
      owner: pbv7
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/pbv7/wsectl
    description: "Unofficial command-line client for Worksection"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Casks
    binaries:
      - wsectl
    # The binary is not Apple-signed or notarized. Strip the macOS
    # quarantine attribute on install so Gatekeeper does not block the
    # CLI with "developer cannot be verified" on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wsectl"]
          end
