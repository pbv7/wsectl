version: 2

project_name: wsectl

builds:
  - main: ./cmd/wsectl
    binary: wsectl
    env:
      - CGO_ENABLED=0
    # darwin needs cgo to compile the macOS Keychain backend in
    # github.com/99designs/keyring (//go:build darwin && cgo). linux/windows
    # native keyring backends are pure-Go. See docs/adr/0001-cgo-and-keyring-backends.md.
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch arm64
          - CXX=clang++ -arch arm64
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch x86_64
          - CXX=clang++ -arch x86_64
    ldflags:
      - -s -w -X github.com/pbv7/wsectl/internal/app.Version={{.Version}} -X github.com/pbv7/wsectl/internal/app.Commit={{.Commit}} -X github.com/pbv7/wsectl/internal/app.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: wsectl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: docs/*.md
        dst: docs
      - src: docs/adr/*.md
        dst: docs/adr
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      # Match both unscoped (docs:) and scoped (docs(x):) conventional types,
      # so housekeeping commits stay out of the changelog either way.
      - '^docs(\([^)]+\))?:'
      - '^test(\([^)]+\))?:'
      - '^chore(\([^)]+\))?:'
      - '^ci(\([^)]+\))?:'
      - '^style(\([^)]+\))?:'
      - 'typo'
  groups:
    # With `use: github`, goreleaser matches these regexps against the raw
    # commit subject (no SHA prefix) — confirmed empirically: v0.2.0 grouped
    # correctly with the ".*?" forms, and v0.3.0 (briefly using SHA-anchored
    # forms) collapsed everything into Others because the subject has no SHA to
    # match. So the lazy ".*?" prefix is required and is the proven form.
    # The Breaking group matches first on a conventional type carrying a "!", so
    # a breaking commit surfaces at the top instead of in its type group; the
    # type list is closed (covers every type this repo uses — add one if a new
    # type is adopted). The residual cost of ".*?" is that a non-standard
    # single-word subject like "hotfix!:" can match a type substring; this is
    # accepted because such subjects do not occur under the repo's conventional
    # commits. Changelog grouping is NOT exercised by `release-snapshot`
    # (snapshot skips the changelog) and `use: github` differs from `use: git`,
    # so the only faithful check is a prerelease tag — validate any change here
    # against a real prerelease release before tagging a final version.
    - title: '⚠️ Breaking Changes'
      regexp: '^.*?(feat|fix|perf|refactor|build|chore|ci|docs|test|style|revert)(\([^)]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 1
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))??!?:.+$'
      order: 3
    - title: Refactoring
      regexp: '^.*?refactor(\([^)]+\))??!?:.+$'
      order: 4
    - title: Dependencies
      regexp: '^.*?build\(deps[^)]*\)!?:.+$'
      order: 5
    - title: Others
      order: 999

release:
  github:
    owner: pbv7
    name: wsectl
  name_template: "{{.ProjectName}} v{{.Version}}"
  # Tags with a prerelease component (vX.Y.Z-rc1) publish as a GitHub
  # prerelease, not "latest" — used to validate changelog grouping safely
  # (see docs/release.md). Final tags (vX.Y.Z) publish as normal releases.
  prerelease: auto
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew install pbv7/tap/wsectl
    ```

    ### Go Install
    ```bash
    go install github.com/pbv7/wsectl/cmd/wsectl@latest
    ```

    ### Binary Download
    Download the appropriate archive from the assets below, extract,
    and place `wsectl` (or `wsectl.exe`) on your `PATH`. Verify against
    `checksums.txt` if needed.
    {{- if .PreviousTag }}

    ---
    **Full Changelog**: https://github.com/pbv7/wsectl/compare/{{ .PreviousTag }}...{{ .Tag }}
    {{- end }}

homebrew_casks:
  - name: wsectl
    ids: [wsectl]
    # Do not push the cask to the tap for prerelease versions (vX.Y.Z-rc1),
    # so a changelog-validation prerelease never touches Homebrew. Final
    # releases (non-prerelease versions) still update the tap.
    skip_upload: "auto"
    repository:
      owner: pbv7
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/pbv7/wsectl
    description: "Unofficial command-line client for Worksection"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Casks
    binaries:
      - wsectl
    # The binary is not Apple-signed or notarized. Strip the macOS
    # quarantine attribute on install so Gatekeeper does not block the
    # CLI with "developer cannot be verified" on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wsectl"]
          end
